name: Trigger auto deployment for ca-docreader

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-docreader-AutoDeployTrigger-85db95ae-8e8a-467f-a57e-995d89e516aa.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CADOCREADER_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acraiw8zs42.azurecr.io
          registryUsername: ${{ secrets.CADOCREADER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CADOCREADER_REGISTRY_PASSWORD }}
          containerAppName: ca-docreader
          resourceGroup: rg-ai-w8-labs
          imageToBuild: acraiw8zs42.azurecr.io/ca-docreader:${{ github.sha }}
          
            

     

